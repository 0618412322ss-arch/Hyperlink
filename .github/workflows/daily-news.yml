name: Daily AI News
on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/update_news.py --output dist/data || echo "No verified update; preserving current edition"
      - name: Commit fresh edition
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/data
          git diff --cached --quiet || git commit -m "data: refresh daily AI news"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
